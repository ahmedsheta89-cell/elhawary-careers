name: Sheets Monitor Dispatcher

on:
  schedule:
    # 09:00 UTC كل يوم أحد = 12:00 بتوقيت المستخدم GMT+3
    - cron: '0 9 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sheets-monitor-dispatcher
  cancel-in-progress: false

jobs:
  monitor:
    name: Run Sheets Monitor from launch-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: sheets-monitoring
    env:
      ELHAWARY_SPREADSHEET_ID: ${{ vars.ELHAWARY_SPREADSHEET_ID || '1xiU35KLjJg2r9dOUwaEV28SWFft8937cIjLDhWjxNt4' }}
      ELHAWARY_APPLICATIONS_SHEET: ${{ vars.ELHAWARY_APPLICATIONS_SHEET || 'Applications' }}
      ELHAWARY_QA_SHEET: ${{ vars.ELHAWARY_QA_SHEET || 'QA_Batch_Test' }}
      FIREBASE_PROJECT_ID: elhawary-careers-2026
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ vars.ELHAWARY_SPREADSHEET_ID || '1xiU35KLjJg2r9dOUwaEV28SWFft8937cIjLDhWjxNt4' }}
      GOOGLE_SHEETS_TEST_TAB: ${{ vars.ELHAWARY_QA_SHEET || 'QA_Batch_Test' }}
      FIRESTORE_REQUIRED: 'false'

    steps:
      - name: Checkout the operational branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: launch-readiness

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned monitor dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r scripts/requirements-monitor.txt

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Validate Python files
        run: python -m py_compile scripts/sheets_client.py scripts/weekly_sync_monitor.py scripts/batch_sync_test.py

      - name: Run weekly monitor and isolated batch test
        run: python scripts/weekly_sync_monitor.py --run-batch-test --max-stale-days 7

      - name: Upload non-secret monitoring results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sheets-monitor-${{ github.run_id }}
          path: |
            weekly-sync-monitor-results.json
            batch-sync-test-results.json
            batch-sync-test-report-ar.md
          if-no-files-found: warn
          retention-days: 30
